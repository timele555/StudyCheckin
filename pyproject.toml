[project]
name = "studycheckin"
version = "2.2.0"
description = "学习进度打卡 V2：pywebview 桌面端 · 原子写入与自动备份 · 便携模式"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "timele555" }]
requires-python = ">=3.12"
dependencies = [
    "pywebview",
    "bottle",
    "waitress",
    "jinja2",
]

[project.urls]
Homepage = "https://github.com/timele555/StudyCheckin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
